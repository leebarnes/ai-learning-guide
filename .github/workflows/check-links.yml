# Monthly check of every external learning-resource link.
#
#  • Each run opens a fresh issue labelled "link-check" (which notifies the repository owner) with a
#    tick-box checklist: broken links, moved links, and links on sites that block automated checks
#    so they must be opened by hand. The previous month's issue is closed as superseded.
#    If every link checks out automatically, no issue is opened and any open one is closed.
#  • Broken links also fail the run, so GitHub sends its usual failed-workflow notification.
#  • Keep-alive: GitHub disables scheduled workflows in public repositories after 60 days without
#    activity. If the last commit is 45+ days old, this makes an empty commit to keep the schedule on.
#    (Commits made with the built-in token don't trigger the deploy workflow.)
name: Check external links

on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write # keep-alive commit
  issues: write # link-check issue

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links
        id: check
        run: npm run check:links
        continue-on-error: true
        env:
          LINK_REPORT: link-report.md

      - name: Open this month's link-check issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.failed }}
          REDIRECTED: ${{ steps.check.outputs.redirected }}
          BLOCKED: ${{ steps.check.outputs.blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f link-report.md ]; then
            echo "No report was produced (the checker itself errored); see the run log."
            exit 0
          fi
          failed=${FAILED:-0}; moved=${REDIRECTED:-0}; manual=${BLOCKED:-0}
          previous=$(gh issue list --label link-check --state open --json number --jq '.[].number')

          if [ $((failed + moved + manual)) -eq 0 ]; then
            echo "Every link checked out automatically; no issue needed."
            for n in $previous; do
              gh issue close "$n" --comment "Every link checked out automatically on the latest run ([run log]($RUN_URL)). Closing."
            done
            exit 0
          fi

          # One fresh issue per month: the checklist is a to-do list, so start with empty boxes.
          title="Link check $(date -u +%Y-%m):"
          [ "$failed" -gt 0 ] && title="$title $failed broken,"
          [ "$moved" -gt 0 ] && title="$title $moved moved,"
          title="$title $manual to check by hand"
          gh label create link-check --color D93F0B --description "Monthly external link check" --force
          new_url=$(gh issue create --title "$title" --label link-check --body-file link-report.md)
          echo "Opened $new_url"
          for n in $previous; do
            gh issue close "$n" --comment "Superseded by #${new_url##*/}."
          done

      - name: Keep the monthly schedule active
        if: always() && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $days day(s) ago."
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled link check active [skip ci]"
            git push
          fi

      - name: Fail the run if any links are broken
        if: steps.check.outcome == 'failure'
        run: |
          echo "One or more links are broken — see the link-check issue or the summary above."
          exit 1
